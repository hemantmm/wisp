# fly.toml app configuration file generated for tcpchat on 2026-11-11T18:52:33+05:30
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'tcpchat'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.http_options]
    idle_timeout = 900

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
